<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片画廊 - 电商图片提取</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🖼️ 图片画廊</h1>
      <p id="image-count">共 0 张图片</p>
    </header>

    <div class="toolbar">
      <label class="checkbox-label">
        <input type="checkbox" id="select-all"> 全选
      </label>
      <span id="selected-count">已选 0 张</span>
      <button id="download-selected" class="btn btn-primary">下载选中</button>
    </div>

    <div class="gallery" id="gallery">
      <!-- 图片会动态插入这里 -->
    </div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
